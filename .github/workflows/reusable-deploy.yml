name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "18"
      require-token:
        required: false
        type: boolean
        default: true

    secrets:
      deploy_token:
        required: false

    outputs:
      deploy_url:
        description: "Deployed URL"
        value: ${{ jobs.deploy.outputs.url }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ inputs.node-version }}

      - name: Test project
        run: npm test

      - name: Deploy to ${{ inputs.environment }}
        id: deploy
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TOKEN: ${{ secrets.deploy_token }}
        run: |
          if [ "${{ inputs.require-token }}" = "true" ] && [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN is required" >&2
            exit 1
          fi
          echo "Deploying to $DEPLOY_ENVIRONMENT"
          echo "url=https://${DEPLOY_ENVIRONMENT}.example.com" >> "$GITHUB_OUTPUT"
